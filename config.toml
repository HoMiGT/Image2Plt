# ==================================================
# Image2PLT - 工业级图片转 PLT 矢量图转换器配置文件
# ==================================================

# 待转换图片存放路径 (支持相对路径或绝对路径)
input_dir = "E:/Downloads/脚环喷码测试_260922/JHCS812_20260922091449/BMP"

# 转换生成的 PLT (HP-GL) 矢量图保存路径
output_dir = "E:/Downloads/脚环喷码测试_260922/JHCS812_20260922091449/PLT"

# 图像二值化与矢量化路径提取配置
[vectorize]
# 矢量化模式:
# - "contour": 轮廓线条模式 (推荐，采用 Canny 边缘检测 & 轮廓追踪，极其契合刻字机、裁床、CNC)
# - "vtracer": 位图矢量化模式
mode = "contour"

# 二值化阈值 (范围 0-255)。
# - 设为 0 时：自动触发工业级 Otsu (大津) 自适应动态阈值算法
threshold = 0

# 是否反转图像颜色 (白底黑线 vs 黑底白线)
invert = false

# Ramer-Douglas-Peucker (RDP) 折线简化容差 (像素单位)
# - 推荐值: 0.5 ~ 2.0
# - 值越大：生成的 PLT 线条越平滑，绘图点数越精简，绘制速度极快
# - 值越小：越保留微小起伏细节，但点数较多
rdp_epsilon = 1.0

# 最小有效路径节点数 (低于此节点数量的微小孤立噪点路径将被自动过滤)
min_points = 3

# PLT (HP-GL) 绘图仪指令输出格式配置
[plt]
# HP-GL 选笔号指令 SP{pen_number}; (工业设备常见笔号为 1, 2, 3 等)
pen_number = 1

# 工业标准 HP-GL 坐标转换映射: 1 mm 对应的 PLT units (标准 1 unit = 0.025 mm, 即 40 units/mm = 1016 DPI)
units_per_mm = 40.0

# 目标输出的物理图幅宽度 (单位: 毫米 mm)
# - 设为 200.0 表示在 PLT 绘图仪上实际刻绘输出宽度为 200mm (高按比例缩放)
# - 设为 0.0 表示按原始图像像素与 PLT units 1:1 直接映射
output_width_mm = 200.0

# 是否翻转 Y 轴（计算机屏幕 Top-Left 坐标系 转换为 绘图仪 Bottom-Left 物理坐标系）
flip_y = true
